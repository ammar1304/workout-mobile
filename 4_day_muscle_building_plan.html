
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap");

:root { color-scheme: dark; }

* { box-sizing: border-box; }

body { margin: 0; background: #0a0c12; color: #e8ecf4; }

.plan-wrap {
  --color-background-primary: #121724;
  --color-background-secondary: #0f1320;
  --color-text-primary: #e8ecf4;
  --color-text-secondary: #9aa3b2;
  --color-border-tertiary: #222a3a;
  --color-border-secondary: #2e384b;
  --border-radius-md: 12px;
  --border-radius-lg: 18px;
  --font-sans: "Space Grotesk", "Sora", sans-serif;

  position: relative;
  padding: 1.75rem;
  margin: 2rem auto;
  max-width: 980px;
  background: linear-gradient(145deg, #0d111b 0%, #111827 45%, #0c111a 100%);
  border: 1px solid #222a3a;
  border-radius: 22px;
  box-shadow: 0 26px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
  font-family: var(--font-sans);
  color: var(--color-text-primary);
  overflow: hidden;
  isolation: isolate;
  animation: fadeIn 0.6s ease;
}

.plan-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(600px 240px at 12% 0%, rgba(124, 92, 255, 0.18), transparent 60%),
    radial-gradient(420px 220px at 86% 8%, rgba(46, 201, 140, 0.16), transparent 60%),
    radial-gradient(520px 260px at 80% 95%, rgba(79, 177, 255, 0.16), transparent 60%);
  opacity: 0.7;
  pointer-events: none;
  z-index: 0;
}

.plan-wrap > * { position: relative; z-index: 1; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.day-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.5rem; padding: 6px; background: rgba(10, 12, 18, 0.55); border: 1px solid var(--color-border-tertiary); border-radius: 16px; backdrop-filter: blur(6px); }
.tab-btn {
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 0.15s ease, color 0.15s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.tab-btn:hover { color: var(--color-text-primary); border-color: var(--color-border-secondary); background: rgba(255, 255, 255, 0.04); transform: translateY(-1px); }
.tab-btn.active {
  border-color: transparent;
  color: #0b0e14;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.15)), var(--accent);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  transform: translateY(-1px);
}
.tab-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 2px; }

.day-card { background: rgba(12, 16, 26, 0.85); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; box-shadow: 0 18px 36px rgba(0, 0, 0, 0.4); animation: fadeUp 0.5s ease; }
.day-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--color-border-tertiary); }
.day-header h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
.day-header p { margin: 0; font-size: 13px; color: var(--color-text-secondary); }
.muscles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.muscle-tag { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; border: 1px solid transparent; opacity: 0; animation: fadeUp 0.4s ease forwards; animation-delay: calc(var(--i) * 40ms); }

.ex-table { width: 100%; border-collapse: collapse; }
.ex-table th { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); text-align: left; padding: 10px 1.5rem; border-top: 1px solid var(--color-border-tertiary); border-bottom: 1px solid var(--color-border-tertiary); background: var(--color-background-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
.ex-table td { padding: 14px 1.5rem; font-size: 14px; border-bottom: 1px solid var(--color-border-tertiary); vertical-align: top; }
.ex-table tbody tr { opacity: 0; animation: fadeUp 0.35s ease forwards; animation-delay: calc(var(--i) * 35ms); }
.ex-table tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
.ex-table tr:last-child td { border-bottom: none; }
.ex-name { font-weight: 600; color: var(--color-text-primary); }
.ex-tip { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.4; }
.badge { font-size: 12px; padding: 4px 8px; border-radius: var(--border-radius-md); font-weight: 600; }
.rest-bar { display: flex; align-items: center; gap: 10px; padding: 12px 1.5rem; background: linear-gradient(135deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.2)); border-top: 1px solid var(--color-border-tertiary); font-size: 13px; color: var(--color-text-secondary); }

.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.week-cell { border-radius: var(--border-radius-md); border: 1px solid var(--color-border-tertiary); padding: 10px 6px; text-align: center; font-size: 11px; background: var(--color-background-secondary); opacity: 0; animation: fadeUp 0.4s ease forwards; animation-delay: calc(var(--i) * 35ms); }
.week-cell .d { font-weight: 600; font-size: 12px; color: var(--color-text-primary); }
.week-cell .l { color: var(--color-text-secondary); margin-top: 2px; }
.week-cell.active-day { border-color: var(--accent); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.06) inset; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 720px) {
  .plan-wrap { padding: 1.25rem; margin: 1.25rem; }
  .week-grid { grid-template-columns: repeat(4, 1fr); }
  .tab-btn { flex: 1 1 150px; text-align: center; }
  .day-header { padding: 1rem 1.25rem; }
  .ex-table thead { display: none; }
  .ex-table tbody tr { display: block; padding: 12px 1.25rem; }
  .ex-table td { display: flex; justify-content: space-between; padding: 6px 0; border: 0; }
  .ex-table td:first-child { display: block; padding-bottom: 10px; }
  .ex-table td:not(:first-child)::before { content: attr(data-label); font-size: 11px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
}

@media (prefers-reduced-motion: reduce) {
  .plan-wrap, .day-card, .muscle-tag, .ex-table tbody tr, .week-cell { animation: none; }
}
</style>

<div class="plan-wrap">
  <h2 class="sr-only">4-Day beginner muscle-building workout plan for a full gym</h2>

  <div class="week-grid" id="weekGrid"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="dayContent"></div>
</div>

<script>
const days = [
  {
    label: "Day 1", name: "Chest & Triceps", day: "Monday",
    color: "#7C5CFF", lightBg: "rgba(124, 92, 255, 0.18)", lightText: "#CFC5FF",
    muscles: ["Chest", "Triceps", "Front Delts"],
    exercises: [
      { name: "Barbell Bench Press", sets: 3, reps: "8–10", rest: "90s", tip: "Keep shoulder blades retracted; don't flare elbows too wide." },
      { name: "Incline Dumbbell Press", sets: 3, reps: "10–12", rest: "90s", tip: "Set bench to 30–45°. Controls the upper chest." },
      { name: "Cable Chest Fly", sets: 3, reps: "12–15", rest: "60s", tip: "Squeeze at the center, keep a slight bend in elbows." },
      { name: "Tricep Rope Pushdown", sets: 3, reps: "12–15", rest: "60s", tip: "Lock elbows at sides, spread the rope at the bottom." },
      { name: "Overhead Dumbbell Extension", sets: 3, reps: "10–12", rest: "60s", tip: "Long-head emphasis. Keep elbows close together." },
    ]
  },
  {
    label: "Day 2", name: "Back & Biceps", day: "Tuesday",
    color: "#2EC98C", lightBg: "rgba(46, 201, 140, 0.16)", lightText: "#B5F6D9",
    muscles: ["Lats", "Traps", "Rhomboids", "Biceps"],
    exercises: [
      { name: "Barbell Bent-Over Row", sets: 3, reps: "8–10", rest: "90s", tip: "Hinge at the hips, keep back flat, pull to lower chest." },
      { name: "Lat Pulldown", sets: 3, reps: "10–12", rest: "90s", tip: "Pull the bar to your collarbone, lean back slightly." },
      { name: "Seated Cable Row", sets: 3, reps: "10–12", rest: "90s", tip: "Chest up, drive elbows back, squeeze shoulder blades." },
      { name: "Face Pulls", sets: 3, reps: "15–20", rest: "60s", tip: "External rotate at the end. Great for shoulder health." },
      { name: "Barbell or Dumbbell Curl", sets: 3, reps: "10–12", rest: "60s", tip: "Control the eccentric (lowering) phase — 2–3 seconds." },
    ]
  },
  {
    label: "Day 3", name: "Legs", day: "Thursday",
    color: "#F28B39", lightBg: "rgba(242, 139, 57, 0.16)", lightText: "#FFD6B1",
    muscles: ["Quads", "Hamstrings", "Glutes", "Calves"],
    exercises: [
      { name: "Barbell Back Squat", sets: 4, reps: "6–8", rest: "2 min", tip: "Break at hips and knees together. Hit at least parallel." },
      { name: "Romanian Deadlift", sets: 3, reps: "10–12", rest: "90s", tip: "Hip hinge, feel a deep stretch in hamstrings, not lower back." },
      { name: "Leg Press", sets: 3, reps: "12–15", rest: "90s", tip: "Foot placement higher = more glutes/hams, lower = quads." },
      { name: "Leg Curl (Seated or Lying)", sets: 3, reps: "12–15", rest: "60s", tip: "Isolates hamstrings. Control the return slowly." },
      { name: "Standing Calf Raise", sets: 4, reps: "15–20", rest: "45s", tip: "Full range of motion — pause at top and bottom." },
    ]
  },
  {
    label: "Day 4", name: "Shoulders & Abs", day: "Saturday",
    color: "#4FB1FF", lightBg: "rgba(79, 177, 255, 0.16)", lightText: "#BFE6FF",
    muscles: ["Shoulders", "Traps", "Core"],
    exercises: [
      { name: "Seated Dumbbell Shoulder Press", sets: 3, reps: "8–10", rest: "90s", tip: "Press straight up, don't arch excessively in your lower back." },
      { name: "Dumbbell Lateral Raise", sets: 4, reps: "12–15", rest: "60s", tip: "Slight forward lean, lead with elbows, don't swing." },
      { name: "Dumbbell Front Raise", sets: 3, reps: "12–15", rest: "60s", tip: "Alternate arms to keep tension. Stop at shoulder height." },
      { name: "Cable Lateral Raise", sets: 3, reps: "15–20", rest: "45s", tip: "Constant tension vs. dumbbells. Great finishing move." },
      { name: "Plank", sets: 3, reps: "30–45 sec", rest: "45s", tip: "Squeeze glutes and abs simultaneously. Breathe normally." },
      { name: "Cable Crunch", sets: 3, reps: "15–20", rest: "45s", tip: "Crunch your ribs toward your hips — not just bowing forward." },
    ]
  }
];

const weekSchedule = [
  { d: "Mon", l: "Day 1", idx: 0 },
  { d: "Tue", l: "Day 2", idx: 1 },
  { d: "Wed", l: "Rest", idx: -1 },
  { d: "Thu", l: "Day 3", idx: 2 },
  { d: "Fri", l: "Rest", idx: -1 },
  { d: "Sat", l: "Day 4", idx: 3 },
  { d: "Sun", l: "Rest", idx: -1 },
];

let active = 0;

function renderWeek() {
  const g = document.getElementById('weekGrid');
  g.innerHTML = weekSchedule.map((w, i) => {
    const d = w.idx >= 0 ? days[w.idx] : null;
    const bg = d ? d.lightBg : 'var(--color-background-secondary)';
    const clr = d ? d.lightText : 'var(--color-text-secondary)';
    const brd = d ? `border-color: ${d.color}66` : 'border-color: var(--color-border-tertiary)';
    const accent = d ? d.color : 'transparent';
    return `<div class="week-cell${d ? ' active-day' : ''}" style="--i:${i}; --accent:${accent}; background:${bg}; ${brd}">
      <div class="d" style="color:${d ? clr : 'var(--color-text-primary)'}">${w.d}</div>
      <div class="l" style="color:${d ? clr : 'var(--color-text-secondary)'};opacity:${d ? 1 : 0.7}">${w.l}</div>
    </div>`;
  }).join('');
}

function renderTabs() {
  const c = document.getElementById('dayTabs');
  c.innerHTML = days.map((d, i) => 
    `<button type="button" class="tab-btn${i===active?' active':''}" data-day="${i}" style="--accent:${d.color}" onclick="setDay(${i})">${d.label}: ${d.name}</button>`
  ).join('');
}

function renderContent() {
  const d = days[active];
  const tags = d.muscles.map((m, i) => 
    `<span class="muscle-tag" style="--i:${i}; background:${d.lightBg}; color:${d.lightText}; border-color:${d.color}55">${m}</span>`
  ).join('');
  const rows = d.exercises.map((e, i) =>
    `<tr style="--i:${i}">
      <td><div class="ex-name">${e.name}</div><div class="ex-tip">${e.tip}</div></td>
      <td data-label="Sets" style="white-space:nowrap"><span class="badge" style="background:${d.lightBg};color:${d.lightText}">${e.sets} sets</span></td>
      <td data-label="Reps" style="white-space:nowrap;color:var(--color-text-secondary)">${e.reps}</td>
      <td data-label="Rest" style="white-space:nowrap;color:var(--color-text-secondary)">${e.rest}</td>
    </tr>`
  ).join('');

  document.getElementById('dayContent').innerHTML = `
    <div class="day-card" style="--accent:${d.color}; --accent-soft:${d.lightBg}; --accent-text:${d.lightText}">
      <div class="day-header">
        <h2 style="color:${d.color}">${d.name} — ${d.day}</h2>
        <p style="color:var(--color-text-secondary)">Full gym · Beginner · ~45–55 min</p>
        <div class="muscles">${tags}</div>
      </div>
      <table class="ex-table">
        <thead><tr>
          <th>Exercise</th><th>Sets</th><th>Reps</th><th>Rest</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="rest-bar"><i class="ti ti-info-circle" style="color:${d.color}" aria-hidden="true"></i> Warm up 5 min before each session. Cool down and stretch 5 min after.</div>
    </div>`;
}

function setDay(i) {
  active = i;
  renderTabs();
  renderContent();
}

renderWeek();
renderTabs();
renderContent();
</script>
